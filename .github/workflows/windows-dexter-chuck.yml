name: Build Dexter U.S. Chuck VST3

on:
  workflow_dispatch:
  push:
    paths:
      - "native/dexter-chuck-vst/**"
      - ".github/workflows/windows-dexter-chuck.yml"

jobs:
  windows-vst3:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure Windows x64
        run: >-
          cmake -S native/dexter-chuck-vst
          -B native/dexter-chuck-vst/build-windows
          -G "Visual Studio 17 2022" -A x64
          -DDEXTER_CHUCK_BUILD_TESTS=ON
      - name: Build both VST3 plug-ins and smoke tests
        run: >-
          cmake --build native/dexter-chuck-vst/build-windows
          --config Release
          --target DexterChuckInstrument_VST3 DexterChuckEffect_VST3
          DexterChuckRuntimeSmoke DexterChuckInstrumentSmoke DexterChuckEffectSmoke
          --parallel 4
      - name: Run audio and processor smoke tests
        run: >-
          ctest --test-dir native/dexter-chuck-vst/build-windows
          -C Release --output-on-failure
      - name: Stage license documents
        if: ${{ always() }}
        shell: pwsh
        run: |
          $bundle = "native/dexter-chuck-vst/build-windows/DistributionLicenses"
          New-Item -ItemType Directory -Force -Path "$bundle/third_party/licenses" | Out-Null
          Copy-Item -LiteralPath "native/dexter-chuck-vst/LICENSE" -Destination "$bundle/LICENSE"
          Copy-Item -LiteralPath "native/dexter-chuck-vst/THIRD_PARTY_NOTICES.md" -Destination "$bundle/THIRD_PARTY_NOTICES.md"
          Copy-Item -Path "native/dexter-chuck-vst/third_party/licenses/*" -Destination "$bundle/third_party/licenses" -Recurse -Force
      - name: Upload Windows x64 VST3 bundles
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Dexter-US-Chuck-Windows-x64-VST3
          path: |
            native/dexter-chuck-vst/build-windows/DexterChuckInstrument_artefacts/Release/VST3/*.vst3
            native/dexter-chuck-vst/build-windows/DexterChuckEffect_artefacts/Release/VST3/*.vst3
            native/dexter-chuck-vst/build-windows/DistributionLicenses/**
          if-no-files-found: warn
